[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peit"
version = "0.1.0"
description = "Personal Economic Inflation Tracker (PEIT)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "Pillow>=10.0.0",
]

[project.scripts]
peit = "peit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
