<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="title desc">
  <title id="title">PEIT — receipt and personal signal identity system</title>
  <desc id="desc">An original open-line receipt with a folded corner, observation marks and a small non-monotonic signal. Full-color, circular, rounded-square and monochrome launcher proposals demonstrate the same alpha-safe artwork. The foreground fits the central adaptive icon safe circle. This is an identity proposal, not evidence of implemented features.</desc>
  <defs>
    <g id="mark" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M39 30H62L72 40V74L66 78L60 74L54 78L48 74L42 78L36 74V33Q36 30 39 30Z M62 30V40H72 M44 43H53 M44 50H59" stroke="#F4F7F2" stroke-width="3.5"/>
      <path d="M43 64L51 59L59 63L66 57" stroke="#70D5BF" stroke-width="3.5"/>
      <circle cx="66" cy="57" r="3" fill="#E8B779"/>
    </g>
    <g id="mono" fill="none" stroke="#102F36" stroke-linejoin="round" stroke-linecap="round" stroke-width="3.5">
      <path d="M39 30H62L72 40V74L66 78L60 74L54 78L48 74L42 78L36 74V33Q36 30 39 30Z M62 30V40H72 M44 43H53 M44 50H59 M43 64L51 59L59 63L66 57"/>
      <circle cx="66" cy="57" r="3" fill="#102F36" stroke="none"/>
    </g>
    <style>
      svg{fill:#112B35}text{font-family:Arial,Helvetica,sans-serif}.muted{fill:#526B70}.small{font-size:12px}.body{font-size:15px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px}.white{fill:#F4F7F2}
      [fill="#102F36"]{fill:#112B35}[stroke="#102F36"]{stroke:#112B35}
      [fill="#176B5B"]{fill:#087F75}[stroke="#176B5B"]{stroke:#087F75}
      [fill="#F3F5F0"],[fill="#F4F6F2"],[fill="#F4F7F2"]{fill:#F4F7F6}
      [fill="#E8B779"],[fill="#BC8448"]{fill:#D99746}[stroke="#E8B779"]{stroke:#D99746}
    </style>
  </defs>
  <rect width="1400" height="1060" fill="#F3F5F0"/>
  <text x="64" y="64" class="eyebrow">PEIT / ORIGINAL IDENTITY PROPOSAL</text>
  <text x="64" y="116" font-size="38" font-weight="700">Small observations. Personal perspective.</text>
  <text x="64" y="149" font-size="16" class="muted">04 / A receipt becomes a signal — without an alarm, a bank vault, or a market arrow.</text>
  <rect x="64" y="190" width="730" height="345" rx="28" fill="#102F36"/>
  <g transform="translate(89 224) scale(2.4)"><use href="#mark"/></g>
  <text x="385" y="340" font-size="85" font-weight="700" letter-spacing="1" class="white">PEIT</text>
  <text x="391" y="383" font-size="19" fill="#A8D9C9">Personal expenditure. Clearer context.</text>
  <text x="100" y="493" class="eyebrow" fill="#A8D9C9">LOCAL OBSERVATIONS / HUMAN REVIEW / TRANSPARENT SIGNALS</text>
  <rect x="818" y="190" width="518" height="345" rx="28" fill="#FFFFFF" stroke="#D7E1D9"/>
  <text x="848" y="229" class="eyebrow">ADAPTIVE ICON GEOMETRY</text>
  <g transform="translate(851 249) scale(1.9)">
    <rect width="108" height="108" fill="#102F36" rx="10"/>
    <rect x="18" y="18" width="72" height="72" fill="none" stroke="#8CAFA4" stroke-width=".5" stroke-dasharray="2 2"/>
    <circle cx="54" cy="54" r="33" fill="none" stroke="#E8B779" stroke-width=".6" stroke-dasharray="2 2"/>
    <use href="#mark"/>
    <path d="M54 0V18M0 54H18M90 54H108M54 90V108" stroke="#8CAFA4" stroke-width=".5"/>
  </g>
  <text x="1080" y="289" font-size="16" font-weight="700">108 × 108 viewport</text>
  <text x="1080" y="321" class="body muted">66 dp safe circle</text>
  <text x="1080" y="349" class="body muted">No clipped essentials</text>
  <text x="1080" y="377" class="body muted">3.5 dp open strokes</text>
  <text x="1080" y="405" class="body muted">Full-bleed ink backdrop</text>
  <text x="848" y="495" class="small muted">Foreground alpha also supplies Android themed monochrome.</text>
  <text x="64" y="580" class="eyebrow">ONE MARK, DIFFERENT CONTEXTS</text>
  <g transform="translate(80 601)">
    <rect width="150" height="150" rx="35" fill="#102F36"/>
    <use href="#mark" transform="scale(1.388889)"/>
    <text x="75" y="180" text-anchor="middle" class="body muted">Rounded square</text>
  </g>
  <g transform="translate(290 601)">
    <circle cx="75" cy="75" r="75" fill="#102F36"/>
    <use href="#mark" transform="scale(1.388889)"/>
    <text x="75" y="180" text-anchor="middle" class="body muted">Circular mask</text>
  </g>
  <g transform="translate(500 601)">
    <rect width="150" height="150" rx="35" fill="#D5E9DC"/>
    <use href="#mono" transform="scale(1.388889)"/>
    <text x="75" y="180" text-anchor="middle" class="body muted">System-tinted alpha</text>
  </g>
  <rect x="700" y="601" width="280" height="150" rx="22" fill="#FFFFFF" stroke="#D7E1D9"/>
  <g transform="translate(735 642)"><rect width="64" height="64" rx="16" fill="#102F36"/><use href="#mark" transform="scale(.592593)"/></g>
  <g transform="translate(826 650)"><rect width="48" height="48" rx="12" fill="#102F36"/><use href="#mark" transform="scale(.444444)"/></g>
  <g transform="translate(910 658)"><rect width="32" height="32" rx="8" fill="#102F36"/><use href="#mark" transform="scale(.296296)"/></g>
  <text x="840" y="781" text-anchor="middle" class="body muted">64 / 48 / 32 pixel studies</text>
  <text x="1020" y="626" font-size="18" font-weight="700">A quiet visual grammar</text>
  <text x="1020" y="657" class="body muted">Receipt = observed evidence</text>
  <text x="1020" y="684" class="body muted">Line = derived personal signal</text>
  <text x="1020" y="711" class="body muted">Dot = a point worth reviewing</text>
  <text x="1020" y="743" class="small muted">No promise of growth or inflation alarm.</text>
  <path d="M64 822H1336" stroke="#D1DED5"/>
  <text x="64" y="859" class="eyebrow">PALETTE / INK, BOTANICAL TEAL, WARM PAPER</text>
  <rect x="64" y="880" width="240" height="82" rx="16" fill="#102F36"/><text x="82" y="910" font-size="16" font-weight="700" class="white">Deep ink</text><text x="82" y="941" class="small white">#112B35 · anchors and text</text>
  <rect x="320" y="880" width="240" height="82" rx="16" fill="#176B5B"/><text x="338" y="910" font-size="16" font-weight="700" class="white">Research teal</text><text x="338" y="941" class="small white">#087F75 · action and review</text>
  <rect x="576" y="880" width="240" height="82" rx="16" fill="#E8B779"/><text x="594" y="910" font-size="16" font-weight="700">Warm accent</text><text x="594" y="941" class="small">#D99746 · attention, not alarm</text>
  <rect x="832" y="880" width="240" height="82" rx="16" fill="#F4F7F2" stroke="#D1DED5"/><text x="850" y="910" font-size="16" font-weight="700">Paper</text><text x="850" y="941" class="small">#F4F7F6 · calm surfaces</text>
  <rect x="1088" y="880" width="248" height="82" rx="16" fill="#70D5BF"/><text x="1106" y="910" font-size="16" font-weight="700">Signal mint</text><text x="1106" y="941" class="small">#70D5BF · icon line on ink</text>
  <text x="64" y="1010" class="small muted">VECTOR ONLY / NO EXTERNAL FONTS, IMAGES OR PACKAGES / ANDROID FOREGROUND + BACKGROUND + MONOCHROME ALPHA</text>
</svg>
